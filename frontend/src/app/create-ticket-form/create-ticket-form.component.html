<div class="modal-backdrop" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Novi tiket</h3>
      <button type="button" class="btn-close" (click)="onCancel()" aria-label="Zatvori">&times;</button>
    </div>

    <form #ticketForm="ngForm" (ngSubmit)="ticketForm.valid && onSubmit()" class="modal-body">
      <div class="form-field">
        <label for="ticket-title">Naslov</label>
        <input
          id="ticket-title"
          name="title"
          type="text"
          [(ngModel)]="form.title"
          required
          minlength="3"
          maxlength="150"
          placeholder="Kratak opis problema" />
      </div>

      <div class="form-field">
        <label for="ticket-description">Opis</label>
        <textarea
          id="ticket-description"
          name="description"
          rows="4"
          [(ngModel)]="form.description"
          required
          minlength="3"
          maxlength="2000"
          placeholder="Detaljan opis problema"></textarea>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="ticket-priority">Prioritet</label>
          <select id="ticket-priority" name="priority" [(ngModel)]="form.priority">
            <option value="">Bez prioriteta</option>
            <option *ngFor="let priority of priorityOptions" [value]="priority">{{ priority }}</option>
          </select>
        </div>

        <div class="form-field">
          <label for="ticket-category">Kategorija</label>
          <select id="ticket-category" name="category" [(ngModel)]="form.category" required>
            <option value="" disabled>Izaberite kategoriju</option>
            <option *ngFor="let category of categoryOptions" [value]="category">{{ category }}</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label for="ticket-created-by">ID korisnika koji prijavljuje</label>
        <input
          id="ticket-created-by"
          name="createdByUserId"
          type="number"
          min="1"
          [(ngModel)]="form.createdByUserId"
          required
          placeholder="Npr. 1" />
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="onCancel()">Otkaži</button>
        <button type="submit" class="btn-primary" [disabled]="ticketForm.invalid">Kreiraj tiket</button>
      </div>
    </form>
  </div>
</div>
