<div class="user-list">
  <h2>Korisnici</h2>

  <p *ngIf="loading">Učitavanje...</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <table *ngIf="!loading && !error && users.length">
    <thead>
      <tr>
        <th>Ime</th>
        <th>Email</th>
        <th>Uloga</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && !error && !users.length">Nema korisnika za prikaz.</p>
</div>
