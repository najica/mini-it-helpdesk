<div class="form-container">
  <h2>{{ isEditMode ? 'Izmena tiketa' : 'Novi tiket' }}</h2>

  <div *ngIf="errorMessage" class="error-banner">
    {{ errorMessage }}
  </div>

  <div *ngIf="loading && isEditMode" class="loading-state">
    Učitavanje podataka...
  </div>

  <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()" *ngIf="!loading || !isEditMode">

    <div class="form-group">
      <label for="title">Naslov *</label>
      <input id="title" type="text" formControlName="title" [class.is-invalid]="ticketForm.get('title')?.invalid && ticketForm.get('title')?.touched" />

      <div class="error-text" *ngIf="ticketForm.get('title')?.invalid && ticketForm.get('title')?.touched">
        Polje Naslov je obavezno.
      </div>
    </div>

    <div class="form-group">
      <label for="description">Opis *</label>
      <textarea id="description" rows="5" formControlName="description" [class.is-invalid]="ticketForm.get('description')?.invalid && ticketForm.get('description')?.touched"></textarea>

      <div class="error-text" *ngIf="ticketForm.get('description')?.invalid && ticketForm.get('description')?.touched">
        Polje Opis je obavezno.
      </div>
    </div>

    <div class="form-group-row">
      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" formControlName="status">
          <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="priority">Prioritet</label>
        <select id="priority" formControlName="priority">
          <option *ngFor="let p of priorityOptions" [value]="p">{{ p }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="category">Kategorija</label>
        <select id="category" formControlName="category">
          <option *ngFor="let c of categoryOptions" [value]="c">{{ c }}</option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" routerLink="/tickets">Odustani</button>
      <button type="submit" class="btn-submit" [disabled]="loading">
        {{ isEditMode ? 'Sačuvaj izmene' : 'Kreiraj tiket' }}
      </button>
    </div>
  </form>
</div>
