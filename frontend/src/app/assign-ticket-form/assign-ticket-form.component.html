<div class="modal-backdrop" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Dodela tiketa</h3>
      <button type="button" class="btn-close" (click)="onCancel()" aria-label="Zatvori">&times;</button>
    </div>

    <form #assignForm="ngForm" (ngSubmit)="assignForm.valid && onSubmit()" class="modal-body">
      <div *ngIf="errorMessage" class="form-error">
        <p>{{ errorMessage }}</p>
      </div>

      <div class="form-field">
        <label for="assign-agent">Agent</label>
        <select
          id="assign-agent"
          name="agent"
          [(ngModel)]="selectedAgentId"
          required
          [disabled]="loadingAgents">
          <option [ngValue]="null" disabled>Izaberite agenta</option>
          <option *ngFor="let agent of agents" [ngValue]="agent.id">{{ agent.id }} - {{ agent.name }}</option>
        </select>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="onCancel()" [disabled]="submitting">Otkaži</button>
        <button type="submit" class="btn-primary" [disabled]="assignForm.invalid || submitting">
          {{ submitting ? 'Dodela...' : 'Dodeli' }}
        </button>
      </div>
    </form>
  </div>
</div>
