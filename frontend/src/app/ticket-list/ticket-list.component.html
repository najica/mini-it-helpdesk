<div class="ticket-list-container">
  <div class="header-section">
    <h2>Lista tiketa</h2>
  </div>

  <div class="filters-section">
    <div class="filter-field">
      <label for="filter-status">Status</label>
      <select id="filter-status" name="filter-status" [(ngModel)]="filterStatus" (ngModelChange)="search()">
        <option [ngValue]="null">Sve</option>
        <option *ngFor="let status of statusOptions" [ngValue]="status">{{ status }}</option>
      </select>
    </div>

    <div class="filter-field">
      <label for="filter-priority">Prioritet</label>
      <select id="filter-priority" name="filter-priority" [(ngModel)]="filterPriority" (ngModelChange)="search()">
        <option [ngValue]="null">Sve</option>
        <option *ngFor="let priority of priorityOptions" [ngValue]="priority">{{ priority }}</option>
      </select>
    </div>

    <div class="filter-field">
      <label for="filter-category">Kategorija</label>
      <select id="filter-category" name="filter-category" [(ngModel)]="filterCategory" (ngModelChange)="search()">
        <option [ngValue]="null">Sve</option>
        <option *ngFor="let category of categoryOptions" [ngValue]="category">{{ category }}</option>
      </select>
    </div>

    <div class="filter-field">
      <label for="filter-user">ID korisnika</label>
      <input
        id="filter-user"
        name="filter-user"
        type="number"
        min="1"
        placeholder="Svi korisnici"
        [(ngModel)]="filterUser"
        (ngModelChange)="search()" />
    </div>
  </div>

  <div *ngIf="loading" class="loading-state">
    <p>Učitavanje tiketa...</p>
  </div>

  <div *ngIf="errorMessage && !loading" class="error-state">
    <p>{{ errorMessage }}</p>
  </div>

  <div *ngIf="!loading && !errorMessage && tickets.length === 0" class="empty-state">
    <p>Nema dostupnih tiketa.</p>
  </div>

  <div *ngIf="!loading && !errorMessage && tickets.length > 0" class="table-responsive">
    <table class="ticket-table">
      <thead>
        <tr>
          <th>Naslov</th>
          <th>Status</th>
          <th>Prioritet</th>
          <th>Kategorija</th>
          <th>Datum kreiranja</th>
          <th>Akcije</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ticket of tickets">
          <td class="ticket-title">
            <a [routerLink]="['/tickets', ticket.id]" class="ticket-link">{{ ticket.title }}</a>
          </td>
          <td>
            <span class="badge badge-status" [ngClass]="'status-' + (ticket.status ? ticket.status.toLowerCase() : '')">
              {{ ticket.status }}
            </span>
          </td>
          <td>
            <span class="badge badge-priority" [ngClass]="'priority-' + (ticket.priority ? ticket.priority.toLowerCase() : 'none')">
              {{ ticket.priority || 'N/A' }}
            </span>
          </td>
          <td>
            <span class="category-text">{{ ticket.category }}</span>
          </td>
          <td>
            {{ ticket.createdAt | date:'dd.MM.yyyy. HH:mm' }}
          </td>
          <td>
            <a [routerLink]="['/tickets', ticket.id]" class="btn-details">
              Detalji
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
